buildscript {
    // Only a standalone build of this library needs its own Android Gradle Plugin; inside an app the app's plugin is used.
    if (project == rootProject) {
        repositories {
            mavenCentral()
            google()
        }

        dependencies {
            classpath 'com.android.tools.build:gradle:7.0.1'
        }
    }
}

def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply plugin: 'com.android.library'
if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    if (project.android.hasProperty("namespace")) {
        namespace = "ly.count.android.sdk.react"
    }

    if (project.android.hasProperty("buildFeatures")) {
        buildFeatures {
            buildConfig true
        }
    }

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)
        targetSdkVersion safeExtGet('targetSdkVersion', 35)

        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    }
    lintOptions {
       warning 'InvalidPackage', 'MissingPermission'
    }
    sourceSets {
        main {
            if (isNewArchitectureEnabled()) {
                java.srcDirs += 'src/newarch'
            } else {
                java.srcDirs += 'src/oldarch'
            }
        }
    }
}

repositories {
    mavenCentral()
    google()
    maven {
        // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
        url "$rootDir/../node_modules/react-native/android"
    }
}

dependencies {
    implementation "com.facebook.react:react-native:${safeExtGet('reactNativeVersion', '+')}"
    implementation 'ly.count.android:sdk:26.1.2'
}
