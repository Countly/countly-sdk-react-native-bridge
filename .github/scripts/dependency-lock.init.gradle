// Turns on dependency locking for the project named in -DlockProject (for example :countly-sdk-react-native-bridge),
// so that a build with --write-locks writes the versions it resolved into that project's gradle.lockfile.
// Only .github/scripts/lock-android-dependencies.sh applies it, through --init-script, so no build file changes.
//
// React Native and what only it pulls in are left out: the app chooses its React Native version, and the scan is about
// what the bridge adds. A library that the Countly SDK or Firebase also needs stays in, through their dependency.
def lockProject = System.getProperty('lockProject')

allprojects { project ->
  if (project.path == lockProject) {
    project.dependencyLocking {
      lockAllConfigurations()
    }
    project.configurations.matching { it.name == 'releaseRuntimeClasspath' }.configureEach {
      exclude group: 'com.facebook.react'
    }
  }
}
