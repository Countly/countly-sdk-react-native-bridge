# Runs the integration scenarios of the example app (example/CountlyRNExample/testing) on an Android emulator and an
# iOS simulator.
#
# The test app is the React Native template app with the packed bridge (.github/scripts/create-device-test-app.sh).
# Its JavaScript runs every scenario once it starts and writes one CLY_E2E line per result; e2e/android/run.mjs reads
# them from logcat, and on iOS the CountlyDeviceTests UI test bundle (e2e/ios) starts React Native inside its runner
# app and reads them from the React Native log. Each scenario becomes one test case.
name: Device tests

on:
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'src/**'
      - '*.js'
      - 'lib/**'
      - 'package.json'
      - 'CountlyReactNative.podspec'
      - 'e2e/**'
      - 'example/CountlyRNExample/testing/**'
      - 'example/CountlyRNExample/Configuration.tsx'
      - '.github/scripts/create-test-app.sh'
      - '.github/scripts/create-device-test-app.sh'
      - '.github/workflows/device_tests.yml'
  push:
    branches: [master, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE: 24

jobs:
  android-emulator:
    name: Android emulator (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: React Native 0.88.1
            react-native: 0.88.1
            new-arch: true
            package: standard
          - name: React Native 0.81.6, old architecture
            react-native: 0.81.6
            new-arch: false
            package: standard
          - name: React Native 0.88.1, no-push package
            react-native: 0.88.1
            new-arch: true
            package: no-push
    env:
      REACT_NATIVE: ${{ matrix.react-native }}
      NEW_ARCH: ${{ matrix.new-arch }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 17
      - name: Create the test app
        run: .github/scripts/create-device-test-app.sh android "$REACT_NATIVE" "$PACKAGE" "$RUNNER_TEMP/app"
      - name: Build the test app
        working-directory: ${{ runner.temp }}/app/android
        # One retry, because downloads from the Gradle plugin portal and Maven Central fail now and then.
        run: |
          build() {
            ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64 "-PnewArchEnabled=$NEW_ARCH"
          }
          build || { echo "::warning::The build failed; trying once more"; build; }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the scenarios on the emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: node e2e/android/run.mjs "$RUNNER_TEMP/app/android/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/app/e2e/scenarios.json" "$RUNNER_TEMP/results/android-emulator-$PACKAGE-$REACT_NATIVE.xml"
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-emulator-results-${{ matrix.package }}-${{ matrix.react-native }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore

  ios-simulator:
    name: iOS simulator (${{ matrix.name }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: React Native 0.88.1
            react-native: 0.88.1
            new-arch: true
            package: standard
          - name: React Native 0.81.6, old architecture
            react-native: 0.81.6
            new-arch: false
            package: standard
          - name: React Native 0.88.1, no-push package
            react-native: 0.88.1
            new-arch: true
            package: no-push
    env:
      REACT_NATIVE: ${{ matrix.react-native }}
      RCT_NEW_ARCH_ENABLED: ${{ matrix.new-arch && '1' || '0' }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE }}
      - name: Create the test app
        run: .github/scripts/create-device-test-app.sh ios "$REACT_NATIVE" "$PACKAGE" "$RUNNER_TEMP/app"
      - name: Install the pods
        working-directory: ${{ runner.temp }}/app/ios
        run: pod install
      # Runner images differ in their simulators, so take an iPhone of the newest iOS runtime there is.
      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available --json | node -e '
            let s = "";
            process.stdin.on("data", (d) => { s += d; }).on("end", () => {
              const runtimes = Object.entries(JSON.parse(s).devices).filter(([r]) => r.includes("iOS"))
                .sort(([a], [b]) => b.localeCompare(a, undefined, { numeric: true }));
              for (const [runtime, devices] of runtimes) {
                const phone = devices.find((d) => d.name.startsWith("iPhone"));
                if (phone) {
                  console.error(`${phone.name}, ${runtime}`);
                  console.log(phone.udid);
                  return;
                }
              }
              process.exit(1);
            });')
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      - name: Run the scenarios on the simulator
        working-directory: ${{ runner.temp }}/app/ios
        run: |
          xcodebuild test \
            -workspace HelloWorld.xcworkspace -scheme CountlyDeviceTests -configuration Debug \
            -destination "id=$SIMULATOR" \
            -resultBundlePath "$RUNNER_TEMP/ios-simulator.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-results-${{ matrix.package }}-${{ matrix.react-native }}
          path: ${{ runner.temp }}/ios-simulator.xcresult
          if-no-files-found: ignore

