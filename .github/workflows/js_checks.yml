name: JS checks
on:
  pull_request:
  push:
    branches: [master, staging, master-np, staging-np]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint
        run: npx eslint .
      - name: Type check Countly.d.ts
        run: npx tsc -p tsconfig.types.json
      - name: Unit tests
        run: npx jest --coverageReporters=json-summary --coverageReporters=text
      - name: Write the coverage summary
        if: matrix.node-version == 24
        run: |
          node -e '
            const total = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "statements", "branches", "functions"].map((metric) =>
              `| ${metric} | ${total[metric].pct}% | ${total[metric].covered}/${total[metric].total} |`);
            console.log(["### Unit test coverage", "", "| Metric | Covered | Count |", "|---|---|---|", ...rows].join("\n"));
          ' > "$RUNNER_TEMP/coverage.md"
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the CI report fragment (coverage)
        if: ${{ !cancelled() && matrix.node-version == 24 }}
        run: |
          [ -s "$RUNNER_TEMP/coverage.md" ] || exit 0
          summary=$(awk '$2 == "lines" { print "Line coverage " $4 }' "$RUNNER_TEMP/coverage.md")
          mkdir -p "$RUNNER_TEMP/ci-report-coverage"
          {
            printf 'Coverage\n%s\n' "${summary:-See details}"
            cat "$RUNNER_TEMP/coverage.md"
          } > "$RUNNER_TEMP/ci-report-coverage/report.md"

      - name: Upload the CI report fragment (coverage)
        if: ${{ !cancelled() && matrix.node-version == 24 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-coverage
          path: ${{ runner.temp }}/ci-report-coverage
          if-no-files-found: ignore
      - name: Generate and test the no-push package
        if: hashFiles('scripts/generate-no-push.js') != ''
        run: |
          node scripts/generate-no-push.js "$RUNNER_TEMP/no-push"
          cd "$RUNNER_TEMP/no-push"
          npm ci --ignore-scripts
          npx tsc -p tsconfig.types.json
          npx jest
