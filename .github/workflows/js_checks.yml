name: JavaScript checks

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type check and unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest release the package supports and the current one.
        node-version: [18, 22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --ext .js,.ts --max-warnings 0
        continue-on-error: true

      - name: Type check the TurboModule specification
        run: npx tsc --noEmit --skipLibCheck src/js/NativeCountlyReactNative.ts

      - name: Unit tests
        run: npm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage
          if-no-files-found: ignore
