name: iOS build

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/**'
      - 'package.json'
      - 'CountlyReactNative.podspec'
      - 'scripts/generate-no-push.js'
      - '.github/workflows/ios_build.yml'
  push:
    branches: [master, staging]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'package.json'
      - 'CountlyReactNative.podspec'
      - 'scripts/generate-no-push.js'
      - '.github/workflows/ios_build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: New architecture (React Native 0.88.1)
            react-native: 0.88.1
            cli: 20.2.0
            new-arch: 1
            package: standard
          - name: Old architecture (React Native 0.81.6)
            react-native: 0.81.6
            cli: 20.0.0
            new-arch: 0
            package: standard
          - name: No-push package (React Native 0.88.1)
            react-native: 0.88.1
            cli: 20.2.0
            new-arch: 1
            package: no-push
    env:
      REACT_NATIVE: ${{ matrix.react-native }}
      CLI: ${{ matrix.cli }}
      RCT_NEW_ARCH_ENABLED: ${{ matrix.new-arch }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # The app installs the packed tarball, so the build sees only the files npm publishes.
      - name: Create an app with the bridge
        run: |
          source=.
          # The no-push branch has no generator, because it already is the no-push package.
          if [ "$PACKAGE" = no-push ] && [ -f scripts/generate-no-push.js ]; then
            node scripts/generate-no-push.js "$RUNNER_TEMP/no-push"
            source="$RUNNER_TEMP/no-push"
          fi
          tarball="$RUNNER_TEMP/$(npm pack "$source" --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          cd "$RUNNER_TEMP"
          npx --yes "@react-native-community/cli@$CLI" init CountlyApp --version "$REACT_NATIVE" --pm npm --skip-git-init --install-pods false
          cd CountlyApp
          npm install --no-audit --no-fund "$tarball"
      - name: Install the pods
        working-directory: ${{ runner.temp }}/CountlyApp/ios
        run: |
          bundle install
          bundle exec pod install
      - name: Build the app for the simulator
        working-directory: ${{ runner.temp }}/CountlyApp/ios
        run: |
          xcodebuild build \
            -workspace CountlyApp.xcworkspace -scheme CountlyApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
