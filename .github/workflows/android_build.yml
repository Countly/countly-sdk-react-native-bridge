name: Android build

on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - '*.js'
      - 'lib/**'
      - 'package.json'
      - 'scripts/generate-no-push.js'
      - '.github/react-native-versions.json'
      - '.github/scripts/create-test-app.sh'
      - '.github/workflows/android_build.yml'
  push:
    branches: [master, staging]
    paths:
      - 'android/**'
      - 'src/**'
      - '*.js'
      - 'lib/**'
      - 'package.json'
      - 'scripts/generate-no-push.js'
      - '.github/react-native-versions.json'
      - '.github/scripts/create-test-app.sh'
      - '.github/workflows/android_build.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    name: React Native versions
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: read
        run: echo "list=$(jq -c . .github/react-native-versions.json)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.list) }}
    env:
      REACT_NATIVE: ${{ matrix.react-native }}
      NEW_ARCH: ${{ matrix.new-arch }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      # The app installs the packed tarball, so the build sees only the files npm publishes.
      - name: Create an app with the bridge
        run: .github/scripts/create-test-app.sh "$REACT_NATIVE" "$PACKAGE" "$RUNNER_TEMP/app"
      # A release build also bundles the JavaScript, and compiles it with Hermes where the app uses Hermes.
      - name: Build the release APK
        working-directory: ${{ runner.temp }}/app/android
        # One retry, because downloads from the Gradle plugin portal and Maven Central fail now and then. Maven Central
        # answers the parallel builds with 429 Too Many Requests at times, so the retry waits a minute first.
        run: |
          build() {
            ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64 "-PnewArchEnabled=$NEW_ARCH"
          }
          build || { echo "::warning::The build failed; trying once more in a minute"; sleep 60; build; }
