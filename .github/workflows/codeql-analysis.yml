name: "CodeQL"

on:
  push:
    branches: [ master, staging ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master, staging ]
  schedule:
    - cron: '18 18 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    # Code scanning needs Code Security, which on a private repository means GitHub Advanced
    # Security. A skipped job reports as skipped rather than as a failure, and this starts
    # running on its own the day the repository is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # The bridge itself: the JavaScript layer and the Android side of the native layer.
        # The iOS side is Swift, which the extractor can only build with an Xcode project.
        language: [ 'javascript-typescript', 'java-kotlin' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: corretto

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # The Android sources are a library module without a standalone Gradle build, so they
          # are scanned as they are rather than built.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
